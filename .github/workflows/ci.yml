name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Repo checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s plugins/codex-best-practices/tests

      - name: Compile Python scripts
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 \
            | xargs -0 python3 -m py_compile

      - name: Validate plugin catalog
        run: python3 scripts/check-plugin-integrity.py

      - name: Check shell script syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)

      - name: Check whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
